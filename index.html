<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova · AI Companion Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Particle background -->
  <canvas id="particle-canvas"></canvas>
  <div class="grain-overlay"></div>

  <div class="app-shell">

    <!-- ===================== HEADER ===================== -->
    <header class="app-header glass">
      <div class="persona-identity">
        <div class="pfp-ring" id="pfpRing">
          <img id="activePfp" src="" alt="Active persona avatar" class="pfp-img">
          <span class="status-dot" id="statusDot"></span>
        </div>
        <div class="persona-text">
          <h1 id="activeName">Nova</h1>
          <p id="activeStatus" class="status-line">Online · Ready to help</p>
        </div>
      </div>

      <div class="persona-dock glass" id="personaDock" role="tablist" aria-label="Choose persona">
        <span class="dock-indicator" id="dockIndicator" aria-hidden="true"></span>

        <button class="dock-tab active" data-persona="nova" role="tab" aria-selected="true" title="Nova — Balanced &amp; direct assistant">
          <img data-avatar="nova" src="" alt="">
          <span class="dock-tab-label">Nova</span>
        </button>

        <button class="dock-tab" data-persona="euler" role="tab" aria-selected="false" title="Prof. Euler — Rigorous math reasoning">
          <img data-avatar="euler" src="" alt="">
          <span class="dock-tab-label">Euler</span>
        </button>

        <button class="dock-tab" data-persona="alisa" role="tab" aria-selected="false" title="Alisa — Soft &amp; adorable companion">
          <img data-avatar="alisa" src="" alt="">
          <span class="dock-tab-label">Alisa</span>
        </button>
      </div>
    </header>

    <!-- ===================== CHAT WINDOW ===================== -->
    <main class="chat-container glass">
      <span class="ambient-glow ambient-glow-a" aria-hidden="true"></span>
      <span class="ambient-glow ambient-glow-b" aria-hidden="true"></span>
      <div class="chat-scroll" id="chatScroll">
        <div class="day-divider"><span>Today</span></div>

        <div class="message incoming" data-persona="nova">
          <img class="msg-avatar" src="" data-avatar="nova" alt="">
          <div class="msg-bubble">
            <p>Hi, I'm Nova. Ask me anything, or switch personas above to talk with Prof. Euler or Alisa.</p>
          </div>
        </div>
      </div>

      <div class="typing-indicator" id="typingIndicator" hidden>
        <img class="msg-avatar" id="typingAvatar" src="" alt="">
        <div class="msg-bubble typing-bubble">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <form class="composer glass" id="composerForm">
        <button type="button" class="composer-icon-btn user-pfp-btn" id="userPfpBtn" title="Set your photo" aria-label="Set your photo">
          <img id="userPfpPreview" class="user-pfp-preview" src="" alt="" hidden>
          <svg id="userPfpPlaceholder" width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20C5.8 16.5 8.6 14.5 12 14.5C15.4 14.5 18.2 16.5 19.5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <input type="file" id="userPfpInput" accept="image/*" hidden>

        <button type="button" class="composer-icon-btn" id="clearBtn" title="Clear conversation" aria-label="Clear conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M9 7V4H15V7M6 7L7 20H17L18 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <textarea
          id="messageInput"
          class="composer-input"
          rows="1"
          placeholder="Message Nova…"
          autocomplete="off"
        ></textarea>

        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </main>

    <p class="footnote">Responses are generated by AI and may be inaccurate.</p>
  </div>

<script src="script.js"></script>
</body>
</html>
