name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        run: |
          sed -i 's|__KEY_1__|${{ secrets.GEMINI_KEY_1 }}|g' script.js
          sed -i 's|__KEY_2__|${{ secrets.GEMINI_KEY_2 }}|g' script.js
          sed -i 's|__KEY_3__|${{ secrets.GEMINI_KEY_3 }}|g' script.js
          sed -i 's|__KEY_4__|${{ secrets.GEMINI_KEY_4 }}|g' script.js
          sed -i 's|__KEY_5__|${{ secrets.GEMINI_KEY_5 }}|g' script.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
