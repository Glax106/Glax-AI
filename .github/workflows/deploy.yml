name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject API Keys
        run: |
          sed -i 's|__KEY_1__|${{ secrets.GEMINI_KEY_1 }}|g' script.js
          sed -i 's|__KEY_2__|${{ secrets.GEMini_KEY_2 }}|g' script.js
          sed -i 's|__KEY_3__|${{ secrets.GEMINI_KEY_3 }}|g' script.js
          sed -i 's|__KEY_4__|${{ secrets.GEMINI_KEY_4 }}|g' script.js
          sed -i 's|__KEY_5__|${{ secrets.GEMINI_KEY_5 }}|g' script.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          
